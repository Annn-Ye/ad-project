spring:
  application:
    name: adproject-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  auth:
    access-token-seconds: 7200
    refresh-token-seconds: 2592000
    jwt-secret: ${JWT_SECRET}
