name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gitleaks:                     
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:                     
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: run maven tests
        working-directory: backend
        run: mvn -B test
      - name: run maven pmd static analysis
        working-directory: backend
        run: mvn -B pmd:check
      - name: upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
      - name: upload backend pmd report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pmd-report
          path: backend/target/pmd.xml
      - name: upload backend test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports

  web:                         
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: run web checks
        working-directory: web
        run: |
          npm ci
          npm run lint -- --format json --output-file eslint-report.json
          npm run typecheck
          npm run test -- --reporter=junit --outputFile=junit.xml
          npm run test:coverage
          npm run build
      - name: upload web lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-eslint-report
          path: web/eslint-report.json
      - name: upload web test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-junit-report
          path: web/junit.xml
      - name: upload web coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage-report
          path: web/coverage

  android:                     
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: build & test android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lint test koverHtmlReportDebug --no-daemon
      - name: upload android coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-kover-report
          path: android/app/build/reports/kover/htmlDebug
      - name: upload android test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/tests/testReleaseUnitTest
            android/app/build/test-results/testReleaseUnitTest/*.xml
            android/app/build/reports/lint-results-*.html
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: run ml checks
        working-directory: ml-service
        run: |
          pip install .[dev]
          ruff check . --output-format json --output-file ruff-report.json
          pytest --cov=ad_recommender --cov-report=html --cov-report=term-missing
      - name: upload ml lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-ruff-report
          path: ml-service/ruff-report.json
      - name: upload ml test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-pytest-reports
          path: ml-service/htmlcov

  sca:                      
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: generate android dependency lockfile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:dependencies --write-locks --no-daemon
      - name: scan backend (Maven)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          output: trivy-backend.txt
      - name: scan web (npm)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: web
          skip-dirs: node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          output: trivy-web.txt
          skip-setup-trivy: true
      - name: scan android (Gradle)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: android
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          output: trivy-android.txt
          skip-setup-trivy: true
      - name: scan ml (Python)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ml-service
          skip-dirs: artifacts
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          output: trivy-ml.txt
          skip-setup-trivy: true
      - name: upload trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-reports
          path: |
            trivy-backend.txt
            trivy-web.txt
            trivy-android.txt
            trivy-ml.txt

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: run agent planner tests
        working-directory: agent-service
        run: |
          python -m pip install -e '.[test]'
          pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: [ backend, web, ml, agent ]
    steps:
      - uses: actions/checkout@v4
      - name: build backend image
        run: docker build -f infra/docker/Dockerfile.backend -t adproject-backend .
      - name: build web image
        run: docker build -f infra/docker/Dockerfile.web -t adproject-web .
      - name: build ml image
        run: docker build -f infra/docker/Dockerfile.ml -t adproject-ml .
      - name: build agent image
        run: docker build -f infra/docker/Dockerfile.agent -t adproject-agent .
