name: CodeQL SAST

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  # schedule:
  #   - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-backend:
    name: Analyze backend (Java)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
      - name: build backend classes
        working-directory: backend
        run: mvn -B -DskipTests compile
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          output: codeql-results-backend
      - name: upload backend codeql report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-backend-sarif
          path: codeql-results-backend/
          if-no-files-found: ignore

  analyze-android:
    name: Analyze android (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
      - name: build android debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          output: codeql-results-android
      - name: upload android codeql report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-android-sarif
          path: codeql-results-android/
          if-no-files-found: ignore

  analyze-web:
    name: Analyze web (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none
      - name: install dependencies
        working-directory: web
        run: npm ci
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: codeql-results-web
      - name: upload web codeql report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-web-sarif
          path: codeql-results-web/
          if-no-files-found: ignore

  analyze-ml:
    name: Analyze ml-service (Python)
    runs-on: ubuntu-latest
    permissions: { security-events: write, actions: read, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
          output: codeql-results-ml
      - name: upload ml codeql report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-ml-sarif
          path: codeql-results-ml/
          if-no-files-found: ignore
