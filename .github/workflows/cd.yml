name: CD

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_BACKEND: adproject-backend:latest
  IMAGE_WEB: adproject-web:latest
  IMAGE_ML: adproject-ml:latest
  IMAGE_AGENT: adproject-agent:latest

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          load: true
          tags: ${{ env.IMAGE_BACKEND }}

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          load: true
          tags: ${{ env.IMAGE_WEB }}

      - name: Build ML image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.ml
          load: true
          tags: ${{ env.IMAGE_ML }}

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.agent
          load: true
          tags: ${{ env.IMAGE_AGENT }}

      - name: Export images to tar
        run: |
          docker save -o /tmp/images.tar ${{ env.IMAGE_BACKEND }} ${{ env.IMAGE_WEB }} ${{ env.IMAGE_ML }} ${{ env.IMAGE_AGENT }}
          ls -lh /tmp/images.tar

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: /tmp/images.tar
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: images
          path: ./images

      - name: upload compose files to target server B
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: infra/docker/docker-compose.yml,infra/docker/nginx.conf
          target: /opt/adproject/infra/docker/
          strip_components: 2
          overwrite: true

      - name: upload images to target server B
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: images/images.tar
          target: /opt/adproject/infra/docker/images/
          strip_components: 1
          overwrite: true

      - name: deploy on target server B
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ vars.RESEND_FROM_ADDRESS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RESEND_API_KEY,RESEND_FROM_ADDRESS,DEEPSEEK_API_KEY
          command_timeout: 20m
          script: |
            set -e
            cd /opt/adproject/infra/docker
            docker load -i /opt/adproject/infra/docker/images/images.tar
            if [ -n "${RESEND_API_KEY:-}" ]; then
              export SMTP_PASSWORD="$RESEND_API_KEY"
            fi
            if [ -n "${RESEND_FROM_ADDRESS:-}" ]; then
              export SMTP_FROM_ADDRESS="$RESEND_FROM_ADDRESS"
            fi
            if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
              export DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
            fi
            docker compose --env-file /opt/adproject/infra/docker/.env up -d --remove-orphans
            docker image prune -f >/dev/null 2>&1 || true
            code=000
            for i in $(seq 1 45); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" \
                -X POST http://localhost/api/v1/auth/login \
                -H "Content-Type: application/json" \
                -d '{"email":"health@probe.local","password":"probe"}' || true)
              case "$code" in
                000|5*) sleep 2 ;;
                *) break ;;
              esac
            done
            echo "health_probe=$code"
