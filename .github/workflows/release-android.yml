name: Android Release

on:
  # push:
  #   tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest tag
        id: latest-tag
        run: |
          git fetch --tags origin --quiet
          TAG=$(git tag --sort=-version:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "No tags found, falling back to ref name ${GITHUB_REF_NAME}"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "Latest tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: decode release keystore from secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
            echo "Keystore decoded to $(pwd)/release.jks"
          else
            echo "RELEASE_KEYSTORE_BASE64 is not set; falling back to debug signing"
          fi
      - name: build signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS_PASSWORD: ${{ secrets.RELEASE_KEY_ALIAS_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.latest-tag.outputs.tag }}
          files: android/app/build/outputs/apk/release/*.apk