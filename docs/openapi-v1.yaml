          description: ISO 4217 currency code for Singapore dollar. SGP is a country code and is not used as currency.
        period:
          type: string
          enum:
          - HOUR
          - MONTH
          - YEAR
      description: MVP supports Singapore dollars only. min/max are integer major currency units; for example SGD
        5,000 is represented as 5000.
