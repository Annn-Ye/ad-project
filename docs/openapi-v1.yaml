        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque UUID. The scope is authenticated user + operation. Replaying the same key with the same
        payload returns the original status/body and creates no duplicate; reusing it with a different payload returns
        409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated principal has the wrong role or insufficient capability
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    CompanyVerificationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CHANGES_REQUESTED]
    ModerationSourceType:
      type: string
      enum: [COMMUNITY_POST, COMMUNITY_COMMENT]
    ModerationStatus:
      type: string
      enum: [PENDING, KEPT, REMOVED]
    AdminCompanyRef:
      type: object
      required: [companyId, name, verificationStatus]
      properties:
        companyId: {type: string, format: uuid}
        name: {type: string}
        verificationStatus: {$ref: '#/components/schemas/CompanyVerificationStatus'}
    AdminUser:
      type: object
      required: [userId, fullName, email, role, status, adminAccess, version, createdAt, updatedAt]
      properties:
        userId: {type: string, format: uuid}
        fullName: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
        adminAccess: {type: boolean}
        company:
          oneOf:
          - $ref: '#/components/schemas/AdminCompanyRef'
          - type: 'null'
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdminUserResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/AdminUser'}
    AdminUserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/AdminUser'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    AdminUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason, expectedVersion]
      properties:
        status: {$ref: '#/components/schemas/UserStatus'}
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '^.*\S.*$'}
        expectedVersion: {type: integer, minimum: 1}
    AdminAccessRequest:
      type: object
      additionalProperties: false
      required: [enabled, reason, expectedVersion]
      properties:
        enabled: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '^.*\S.*$'}
        expectedVersion: {type: integer, minimum: 1}
    CompanyReview:
      type: object
      required: [companyId, name, verificationStatus, version, createdByUserId, createdByName, createdAt, updatedAt]
      properties:
        companyId: {type: string, format: uuid}
        name: {type: string}
        logoUrl:
          oneOf: [{type: string, format: uri}, {type: 'null'}]
        stage:
          oneOf: [{type: string}, {type: 'null'}]
        employeeRange:
          oneOf: [{type: string}, {type: 'null'}]
        verificationStatus: {$ref: '#/components/schemas/CompanyVerificationStatus'}
        website:
          oneOf: [{type: string, format: uri}, {type: 'null'}]
        description:
          oneOf: [{type: string}, {type: 'null'}]
        location:
          oneOf: [{type: string}, {type: 'null'}]
        version: {type: integer, minimum: 1}
        createdByUserId: {type: string, format: uuid}
        createdByName: {type: string}
        createdByEmail:
          oneOf: [{type: string, format: email}, {type: 'null'}]
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CompanyReviewResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/CompanyReview'}
    CompanyReviewListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/CompanyReview'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    AdminReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '^.*\S.*$'}
        expectedVersion: {type: integer, minimum: 1}
    ModerationCase:
      type: object
      required: [caseId, sourceType, sourceId, contentSnapshot, reportReason, reportCount, status, version, createdAt, updatedAt]
      properties:
        caseId: {type: string, format: uuid}
        sourceType: {$ref: '#/components/schemas/ModerationSourceType'}
        sourceId: {type: string, format: uuid}
        authorId:
          oneOf: [{type: string, format: uuid}, {type: 'null'}]
        authorName:
          oneOf: [{type: string}, {type: 'null'}]
        contentSnapshot: {type: string}
        reportReason: {type: string}
        reportCount: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/ModerationStatus'}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ModerationCaseResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/ModerationCase'}
    ModerationCaseListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ModerationCase'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    ModerationDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason, expectedVersion]
      properties:
        decision: {type: string, enum: [KEEP, REMOVE]}
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '^.*\S.*$'}
        expectedVersion: {type: integer, minimum: 1}
    AdminAuditEvent:
      type: object
      required: [auditEventId, actorName, action, targetType, targetId, reason, requestId, occurredAt]
      properties:
        auditEventId: {type: string, format: uuid}
        actorId:
          oneOf: [{type: string, format: uuid}, {type: 'null'}]
        actorName: {type: string}
        action: {type: string}
        targetType: {type: string}
        targetId: {type: string}
        beforeState:
          oneOf: [{type: string}, {type: 'null'}]
        afterState:
          oneOf: [{type: string}, {type: 'null'}]
        reason: {type: string}
        requestId: {type: string}
        occurredAt: {type: string, format: date-time}
    AdminAuditEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/AdminAuditEvent'}
        meta: {$ref: '#/components/schemas/PageMeta'}
    RegisterRequest:
      oneOf:
      - $ref: '#/components/schemas/CandidateRegisterRequest'
      - $ref: '#/components/schemas/RecruiterRegisterRequest'
      discriminator:
        propertyName: role
        mapping:
          CANDIDATE: '#/components/schemas/CandidateRegisterRequest'
          RECRUITER: '#/components/schemas/RecruiterRegisterRequest'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          description: Single-use rotating refresh token. A successful refresh revokes it and returns a new refresh
            token.
    AuthUser:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        required:
        - permissions
        properties:
          permissions:
            type: array
            items:
              type: string
              enum: [PLATFORM_ADMIN]
          company:
            oneOf:
            - $ref: '#/components/schemas/Company'
            - type: 'null'
        description: company is present for Recruiter accounts and null for Candidate accounts.
    TokenData:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - refreshExpiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          const: 7200
          description: 'Access token lifetime in seconds: 2 hours for MVP.'
        refreshExpiresIn:
          type: integer
          const: 2592000
          description: 'Refresh token lifetime in seconds: 30 days for MVP.'
    AuthResponse:
      type: object
      required:
      - data
      properties:
        data:
          allOf:
