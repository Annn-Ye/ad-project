        cancel, and completion alike — is rejected with 409 GOOGLE_MEET_SYNC_IN_PROGRESS before the optimistic
        version is compared, so a stale expectedVersion never masquerades as a version conflict. A remote failure
        leaves the interview SCHEDULED with its original time/link and meetingSyncStatus FAILED (retryable via the
        same PATCH); an unexpected external error is likewise converted to a safe FAILED rather than leaving the
        interview stuck in PENDING. Completion of a non-PENDING GOOGLE_MEET interview is local-only.'
      x-audit: true
      x-concurrency: Require expectedVersion; compare atomically; on success increment version; mismatch returns
        409 VERSION_CONFLICT.
