      - INTERVIEW
      - REJECTED
      - WITHDRAWN
      description: 'MVP lifecycle: APPLIED->IN_REVIEW|REJECTED|WITHDRAWN; IN_REVIEW->INTERVIEW|REJECTED|WITHDRAWN;
        INTERVIEW->REJECTED|WITHDRAWN; REJECTED and WITHDRAWN are terminal. Recruiter cannot set WITHDRAWN; Candidate
        can only withdraw their own application. NOT_APPLIED is intentionally excluded. OFFERED/HIRED are deferred
        to a future Offer resource.'
