openapi: 3.1.0
info:
  title: HireX Unified Candidate + Recruiter API
  version: 1.0.0-draft
  description: 'DRAFT API v1 contract for Candidate Android and Recruiter Web. HTTP Method + normalized Path is
    the unique operation key. JSON fields use camelCase; all IDs are opaque strings; all date-time values are ISO-8601
    UTC and end with Z. OpenAPI is the implementation source of truth. MVP decisions: SGD integer major units; one
    Resume per Candidate; Recruiter registration creates a company; fixed transition matrices; deferred features
    are marked with x-mvp-scope.'
servers:
- url: http://localhost:8080/api/v1
  description: MVP local Web and backend development
- url: http://10.0.2.2:8080/api/v1
  description: MVP Android Emulator access to the host backend
tags:
- name: Auth
- name: Profile
- name: Jobs
- name: Applications
- name: Interviews
- name: Conversations
- name: Messages
- name: Resume
- name: Recommendations
- name: Features
- name: Admin
- name: Community
- name: Agent
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register Candidate or Recruiter
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
      description: 'Permission: Public. Status: DRAFT. Clients: Candidate, Recruiter.'
      x-mvp-scope: MVP
  /auth/login:
    post:
      tags:
      - Auth
      summary: Log in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
      description: 'Permission: Public. Status: DRAFT. Clients: Candidate, Recruiter.'
      x-mvp-scope: MVP
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate access and refresh tokens
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
      description: 'Permission: Public. Status: DRAFT. Clients: Candidate, Recruiter.'
      x-mvp-scope: MVP
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke the current refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Authenticated session
      description: 'Permission: Authenticated session. Status: DRAFT. Clients: Candidate, Recruiter.'
      x-mvp-scope: MVP
  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a one-time password reset code
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: The same accepted response is returned whether or not the email exists.
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Email delivery is not configured or unavailable.
      x-permission: Public
      x-clients: [Candidate, Recruiter]
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a one-time code and replace the password
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Password changed and all existing sessions revoked. }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-permission: Public
      x-clients: [Candidate, Recruiter]
  /candidate/onboarding:
    post:
      tags: [Profile, Resume, Recommendations]
      summary: Atomically complete Candidate profile, default resume, and job preferences
      operationId: completeCandidateOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateOnboardingRequest' }
      responses:
        '204': { description: Onboarding completed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-permission: Candidate self
      x-clients: [Candidate]
  /jobs:
    get:
      tags:
      - Jobs
      summary: Search and filter jobs
      operationId: listJobs
      parameters:
      - name: q
        in: query
        schema: {type: string}
      - name: category
        in: query
        schema: {$ref: '#/components/schemas/CommunityCategory'}
      - name: q
        in: query
        schema:
          type: string
      - name: employmentType
        in: query
        schema:
          $ref: '#/components/schemas/EmploymentType'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Job page
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/CandidateJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate role; returns ACTIVE visible jobs only
      description: 'Permission: Candidate role; returns ACTIVE visible jobs only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /jobs/{jobId}:
    get:
      tags:
      - Jobs
      summary: Get a job and candidate match analysis
      operationId: getJob
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateJobDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate role; ACTIVE visible job only
      description: 'Permission: Candidate role; ACTIVE visible job only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /jobs/{jobId}/applications:
    post:
      tags:
      - Applications
      summary: Submit an application
      operationId: submitApplication
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitApplicationRequest'
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateApplicationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate role; own Resume; target job must be ACTIVE and accepting applications
      description: 'Permission: Candidate role; own Resume; target job must be ACTIVE and accepting applications.
        Status: DRAFT. Clients: Candidate. Idempotency: same key + same payload returns the original result; same
        key + different payload returns 409 IDEMPOTENCY_KEY_REUSED. A different idempotency key for the same Candidate
        + job returns 409 APPLICATION_ALREADY_EXISTS.'
      x-mvp-scope: MVP
  /candidate/applications:
    get:
      tags:
      - Applications
      summary: List the current candidate's applications
      operationId: listApplications
      parameters:
      - name: filter
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationListFilter'
        description: UI grouping only; this is not ApplicationStatus.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Application page with counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateApplicationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate. Filter groups: ACTIVE
        maps to APPLIED and IN_REVIEW; INTERVIEW maps to INTERVIEW; ARCHIVED maps to REJECTED and WITHDRAWN.
        Counts are calculated across all of the current Candidate''s applications before filtering and pagination.
        Default stable sort: appliedAt DESC, then applicationId DESC. Timeline entries come from persisted
        application_status_events ordered by occurredAt ASC, then event id ASC.'
      x-mvp-scope: MVP
  /candidate/applications/{applicationId}:
    get:
      tags:
      - Applications
      summary: Get an application
      operationId: getApplication
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateApplicationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate application owner only
      description: 'Permission: Candidate application owner only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/conversations:
    get:
      tags:
      - Conversations
      summary: List conversations
      operationId: listConversations
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Conversation page
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: IMPLEMENTED
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: IMPLEMENTED. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/conversations/job/{jobId}:
    post:
      tags:
      - Conversations
      summary: Start or return a Candidate inquiry conversation for a public active job
      operationId: startCandidateInquiry
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Candidate inquiry conversation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConversationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-status: IMPLEMENTED
      x-clients:
      - Candidate
      x-permission: Candidate may contact only the recruiter for an active public job
      description: 'Idempotently creates the Candidate/job/recruiter inquiry conversation. Status: IMPLEMENTED. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/conversations/{conversationId}:
    get:
      tags:
      - Conversations
      summary: Get conversation participant and business context
      operationId: getConversation
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation context
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConversationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: IMPLEMENTED
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: IMPLEMENTED. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/conversations/{conversationId}/messages:
    get:
      tags:
      - Messages
      summary: Get message history
      operationId: listMessages
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: before
        in: query
        description: Return messages older than this message ID.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Cursor-paginated messages ordered by sentAt ascending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: IMPLEMENTED
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: IMPLEMENTED. Clients: Candidate.'
      x-mvp-scope: MVP
    post:
      tags:
      - Messages
      summary: Send a message
      operationId: sendMessage
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-status: IMPLEMENTED
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: IMPLEMENTED. Clients: Candidate. Idempotency:
        same key + same payload returns the original result; same key + different payload returns 409 IDEMPOTENCY_KEY_REUSED.
        clientMessageId is also unique within the conversation and duplicate reuse returns the original Message
        when the payload matches.'
      x-mvp-scope: MVP
  /candidate/conversations/{conversationId}/messages/attachment:
    post:
      tags:
      - Messages
      summary: Send a message with an attachment
      operationId: sendCandidateMessageWithAttachment
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - clientMessageId
              - file
              properties:
                clientMessageId:
                  type: string
                  format: uuid
                body:
                  type: string
                  description: Optional message body; omit for an attachment-only message.
                file:
                  type: string
                  format: binary
                  description: A single file (PDF, DOC, DOCX, TXT, PNG, JPG, JPEG) up to 10 MB.
      responses:
        '201':
          description: Message created with attachment metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Attachment exceeds the 10 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-status: IMPLEMENTED
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: IMPLEMENTED. Clients: Candidate. Idempotency:
        same key + same payload returns the original result; same key + different payload returns 409 IDEMPOTENCY_KEY_REUSED.
        File type is validated against a server whitelist (extension + magic bytes) and capped at 10 MB.'
      x-mvp-scope: MVP
  /candidate/conversations/{conversationId}/messages/{messageId}/attachment:
    get:
      tags:
      - Messages
      summary: Download a message attachment
      operationId: downloadCandidateMessageAttachment
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: messageId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Attachment bytes
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename
            X-Content-Type-Options:
              schema:
                type: string
              description: Always nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: IMPLEMENTED
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: IMPLEMENTED. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/conversations/{conversationId}/read-state:
    put:
      tags:
      - Conversations
      summary: Set the last read message
      operationId: updateConversationReadState
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadStateRequest'
      responses:
        '204':
          description: Read state updated
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-status: IMPLEMENTED
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: IMPLEMENTED. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/profile:
    get:
      tags:
      - Profile
      summary: Get candidate profile and counters
      operationId: getCandidateProfile
      responses:
        '200':
          description: Candidate profile
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
    patch:
      tags:
      - Profile
      summary: Update candidate profile fields
      operationId: updateCandidateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateProfile'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate. Concurrency: Require expectedVersion;
        compare atomically; on success increment version; mismatch returns 409 VERSION_CONFLICT.'
      x-concurrency: Require expectedVersion; compare atomically; on success increment version; mismatch returns
        409 VERSION_CONFLICT.
      x-mvp-scope: MVP
  /candidate/resume:
    get:
      tags:
      - Resume
      summary: Get the candidate's online resume
      operationId: getResume
      responses:
        '200':
          description: Resume
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Resume'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
    put:
      tags:
      - Resume
      summary: Replace the candidate's online resume
      operationId: saveResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveResumeRequest'
      responses:
        '200':
          description: Saved resume
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Resume'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate. Concurrency: Require expectedVersion;
        compare atomically; on success increment version; mismatch returns 409 VERSION_CONFLICT.'
      x-concurrency: Require expectedVersion; compare atomically; on success increment version; mismatch returns
        409 VERSION_CONFLICT.
      x-mvp-scope: MVP
  /candidate/job-preferences:
    get:
      tags:
      - Recommendations
      summary: Get the current candidate's structured job preferences
      operationId: getCandidateJobPreferences
      responses:
        '200':
