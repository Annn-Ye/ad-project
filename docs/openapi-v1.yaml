openapi: 3.1.0
info:
  title: AD Project Unified Candidate + Recruiter API
  version: 1.0.0-draft
  description: 'DRAFT API v1 contract for Candidate Android and Recruiter Web. HTTP Method + normalized Path is
    the unique operation key. JSON fields use camelCase; all IDs are opaque strings; all date-time values are ISO-8601
    UTC and end with Z. OpenAPI is the implementation source of truth. MVP decisions: SGD integer major units; one
    Resume per Candidate; Recruiter registration creates a company; fixed transition matrices; deferred features
    are marked with x-mvp-scope.'
servers:
- url: http://localhost:8080/api/v1
  description: MVP local Web and backend development
- url: http://10.0.2.2:8080/api/v1
  description: MVP Android Emulator access to the host backend
tags:
- name: Auth
- name: Profile
- name: Jobs
- name: Applications
- name: Interviews
- name: Conversations
- name: Messages
- name: Resume
- name: Features
- name: Admin
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register Candidate or Recruiter
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
      description: 'Permission: Public. Status: DRAFT. Clients: Candidate, Recruiter.'
      x-mvp-scope: MVP
  /auth/login:
    post:
      tags:
      - Auth
      summary: Log in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
      description: 'Permission: Public. Status: DRAFT. Clients: Candidate, Recruiter.'
      x-mvp-scope: MVP
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate access and refresh tokens
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
      description: 'Permission: Public. Status: DRAFT. Clients: Candidate, Recruiter.'
      x-mvp-scope: MVP
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke the current refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Authenticated session
      description: 'Permission: Authenticated session. Status: DRAFT. Clients: Candidate, Recruiter.'
      x-mvp-scope: MVP
  /jobs:
    get:
      tags:
      - Jobs
      summary: Search and filter jobs
      operationId: listJobs
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: employmentType
        in: query
        schema:
          $ref: '#/components/schemas/EmploymentType'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Job page
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/CandidateJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate role; returns ACTIVE visible jobs only
      description: 'Permission: Candidate role; returns ACTIVE visible jobs only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /jobs/{jobId}:
    get:
      tags:
      - Jobs
      summary: Get a job and candidate match analysis
      operationId: getJob
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateJobDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate role; ACTIVE visible job only
      description: 'Permission: Candidate role; ACTIVE visible job only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /jobs/{jobId}/applications:
    post:
      tags:
      - Applications
      summary: Submit an application
      operationId: submitApplication
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitApplicationRequest'
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateApplicationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate role; own Resume; target job must be ACTIVE and accepting applications
      description: 'Permission: Candidate role; own Resume; target job must be ACTIVE and accepting applications.
        Status: DRAFT. Clients: Candidate. Idempotency: same key + same payload returns the original result; same
        key + different payload returns 409 IDEMPOTENCY_KEY_REUSED. A different idempotency key for the same Candidate
        + job returns 409 APPLICATION_ALREADY_EXISTS.'
      x-mvp-scope: MVP
  /candidate/applications:
    get:
      tags:
      - Applications
      summary: List the current candidate's applications
      operationId: listApplications
      parameters:
      - name: filter
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationListFilter'
        description: UI grouping only; this is not ApplicationStatus.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Application page with counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateApplicationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/applications/{applicationId}:
    get:
      tags:
      - Applications
      summary: Get an application
      operationId: getApplication
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateApplicationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate application owner only
      description: 'Permission: Candidate application owner only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/conversations:
    get:
      tags:
      - Conversations
      summary: List conversations
      operationId: listConversations
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Conversation page
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/conversations/{conversationId}:
    get:
      tags:
      - Conversations
      summary: Get conversation participant and business context
      operationId: getConversation
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation context
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConversationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/conversations/{conversationId}/messages:
    get:
      tags:
      - Messages
      summary: Get message history
      operationId: listMessages
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: before
        in: query
        description: Return messages older than this message ID.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Cursor-paginated messages ordered by sentAt ascending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
    post:
      tags:
      - Messages
      summary: Send a message
      operationId: sendMessage
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: DRAFT. Clients: Candidate. Idempotency:
        same key + same payload returns the original result; same key + different payload returns 409 IDEMPOTENCY_KEY_REUSED.
        clientMessageId is also unique within the conversation and duplicate reuse returns the original Message
        when the payload matches.'
      x-mvp-scope: MVP
  /candidate/conversations/{conversationId}/read-state:
    put:
      tags:
      - Conversations
      summary: Set the last read message
      operationId: updateConversationReadState
      parameters:
      - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadStateRequest'
      responses:
        '204':
          description: Read state updated
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate conversation participant only
      description: 'Permission: Candidate conversation participant only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /candidate/profile:
    get:
      tags:
      - Profile
      summary: Get candidate profile and counters
      operationId: getCandidateProfile
      responses:
        '200':
          description: Candidate profile
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
    patch:
      tags:
      - Profile
      summary: Update candidate profile fields
      operationId: updateCandidateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CandidateProfile'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate. Concurrency: Require expectedVersion;
        compare atomically; on success increment version; mismatch returns 409 VERSION_CONFLICT.'
      x-concurrency: Require expectedVersion; compare atomically; on success increment version; mismatch returns
        409 VERSION_CONFLICT.
      x-mvp-scope: MVP
  /candidate/resume:
    get:
      tags:
      - Resume
      summary: Get the candidate's online resume
      operationId: getResume
      responses:
        '200':
          description: Resume
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Resume'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
    put:
      tags:
      - Resume
      summary: Replace the candidate's online resume
      operationId: saveResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveResumeRequest'
      responses:
        '200':
          description: Saved resume
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Resume'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate self only
      description: 'Permission: Candidate self only. Status: DRAFT. Clients: Candidate. Concurrency: Require expectedVersion;
        compare atomically; on success increment version; mismatch returns 409 VERSION_CONFLICT.'
      x-concurrency: Require expectedVersion; compare atomically; on success increment version; mismatch returns
        409 VERSION_CONFLICT.
      x-mvp-scope: MVP
  /features/learning:
    get:
      tags:
      - Features
      summary: Get Learning feature availability
      operationId: getLearningFeature
      responses:
        '200':
          description: Learning availability
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/LearningFeature'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Candidate role
      description: 'Permission: Candidate role. Status: DRAFT. Clients: Candidate.'
      x-mvp-scope: MVP
  /recruiter/me:
    get:
      tags:
      - Profile
      summary: Get current recruiter
      operationId: getRecruiterMe
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter self
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RecruiterProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Permission: Recruiter self. Status: DRAFT. Clients: Recruiter.'
      x-mvp-scope: MVP
  /recruiter/company:
    get:
      tags:
      - Profile
      summary: Get recruiter company
      operationId: getRecruiterCompany
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter company member; current company scope only
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Permission: Recruiter company member; current company scope only. Status: DRAFT. Clients: Recruiter.'
      x-mvp-scope: MVP
    patch:
      tags:
      - Profile
      summary: Update recruiter company
      operationId: updateRecruiterCompany
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter company admin capability; current company scope only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: 'Permission: Recruiter company admin capability; current company scope only. Status: DRAFT. Clients:
        Recruiter. Concurrency: Require expectedVersion; compare atomically; on success increment version; mismatch
        returns 409 VERSION_CONFLICT.'
      x-concurrency: Require expectedVersion; compare atomically; on success increment version; mismatch returns
        409 VERSION_CONFLICT.
      x-mvp-scope: MVP
  /recruiter/dashboard:
    get:
      tags:
      - Profile
      summary: Get own-company dashboard
      operationId: getRecruiterDashboard
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own-company aggregate
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RecruiterDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Permission: Recruiter; own-company aggregate. Status: DRAFT. Clients: Recruiter.'
      x-mvp-scope: MVP
  /recruiter/jobs:
    get:
      tags:
      - Jobs
      summary: List own-company jobs
      operationId: listRecruiterJobs
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own company
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/JobStatus'
      - name: employmentType
        in: query
        schema:
          $ref: '#/components/schemas/EmploymentType'
      - name: location
        in: query
        schema:
          type: string
      - name: ownerId
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/RecruiterJobSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Permission: Recruiter; own company. Status: DRAFT. Clients: Recruiter.'
      x-mvp-scope: MVP
    post:
      tags:
      - Jobs
      summary: Create job draft
      operationId: createRecruiterJob
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; verified own company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
